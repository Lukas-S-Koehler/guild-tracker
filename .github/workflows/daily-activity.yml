name: Daily Guild Activity Fetch

on:
  schedule:
    # Runs at 11:48 UTC daily — 2 min before game day boundary (11:50 UTC / 13:50 GMT+2)
    - cron: '48 11 * * *'
  workflow_dispatch:
    inputs:
      run_backfill:
        description: 'Run backfill instead of daily fetch'
        required: false
        default: 'false'
        type: boolean
      backfill_days:
        description: 'Days to backfill (default 90)'
        required: false
        default: '90'
        type: string
      guild_id:
        description: 'Specific guild ID to backfill (leave empty for all)'
        required: false
        default: ''
        type: string

jobs:
  fetch-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Fetch daily guild activity
        if: ${{ github.event.inputs.run_backfill != 'true' }}
        run: |
          echo "Fetching daily activity for all guilds..."
          response=$(curl -s -L -w "\n%{http_code}" -X POST "${{ secrets.SITE_URL }}/api/cron/daily-activity" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "Response: $body"
          echo "HTTP status: $http_code"
          if [ "$http_code" != "200" ]; then
            echo "ERROR: Daily activity fetch failed with status $http_code"
            exit 1
          fi

      - name: Sync members for all guilds
        if: ${{ github.event.inputs.run_backfill != 'true' }}
        run: |
          echo "Syncing members for all guilds..."
          response=$(curl -s -L -w "\n%{http_code}" -X POST "${{ secrets.SITE_URL }}/api/cron/members-sync-all" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "Response: $body"
          echo "HTTP status: $http_code"

      - name: Sync Discord roles
        if: ${{ github.event.inputs.run_backfill != 'true' }}
        run: |
          echo "Syncing Discord guild roles (no-op unless auto sync is on in Admin → Discord → Role sync)..."
          response=$(curl -s -L -w "\n%{http_code}" -X POST "${{ secrets.SITE_URL }}/api/cron/discord-roles" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "Response: $body"
          echo "HTTP status: $http_code"


      - name: Auto-warn inactive members
        if: ${{ github.event.inputs.run_backfill != 'true' }}
        run: |
          echo "Running auto-warn for all guilds..."
          response=$(curl -s -L -w "\n%{http_code}" -X POST "${{ secrets.SITE_URL }}/api/cron/auto-warn" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "Response: $body"
          echo "HTTP status: $http_code"


      - name: Refresh live Discord messages
        if: ${{ github.event.inputs.run_backfill != 'true' }}
        run: |
          echo "Refreshing live Discord messages (directory, raid schedule, links)..."
          response=$(curl -s -L -w "\n%{http_code}" -X POST "${{ secrets.SITE_URL }}/api/cron/discord-live" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "Response: $body"
          echo "HTTP status: $http_code"


      - name: Evaluate achievements
        if: ${{ github.event.inputs.run_backfill != 'true' }}
        run: |
          echo "Evaluating achievements + #hall-of-fame digest..."
          response=$(curl -s -L -w "\n%{http_code}" -X POST "${{ secrets.SITE_URL }}/api/cron/achievements" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "Response: $body"
          echo "HTTP status: $http_code"


      - name: Run backfill
        if: ${{ github.event.inputs.run_backfill == 'true' }}
        run: |
          DAYS="${{ github.event.inputs.backfill_days }}"
          GUILD_ID="${{ github.event.inputs.guild_id }}"
          PAYLOAD="{\"days\": $DAYS"
          if [ -n "$GUILD_ID" ]; then
            PAYLOAD="$PAYLOAD, \"guild_id\": \"$GUILD_ID\""
          fi
          PAYLOAD="$PAYLOAD}"
          echo "Running backfill: $PAYLOAD"
          response=$(curl -s -L -w "\n%{http_code}" -X POST "${{ secrets.SITE_URL }}/api/cron/backfill" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "Response: $body"
          echo "HTTP status: $http_code"
          if [ "$http_code" != "200" ]; then
            echo "ERROR: Backfill failed with status $http_code"
            exit 1
          fi
