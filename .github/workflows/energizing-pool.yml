name: Energizing Pool Activation Ping

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ping-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check energizing pool status
        run: |
          echo "Checking energizing pool activation..."
          response=$(curl -s -L -w "\n%{http_code}" -X POST "${{ secrets.SITE_URL }}/api/cron/energizing-pool" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "Response: $body"
          echo "HTTP status: $http_code"
          if [ "$http_code" != "200" ]; then
            echo "ERROR: Energizing pool check failed with status $http_code"
            exit 1
          fi
